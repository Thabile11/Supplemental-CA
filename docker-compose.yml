services:
  proxy:
    image: nginx:1.27-alpine
    container_name: secure_proxy
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy_logs:/var/log/nginx
    depends_on:
      - web
      - admin
    networks:
      - edge
      - app_net
      - internal_net
    restart: unless-stopped

  web:
    build: ./app
    container_name: public_web
    environment:
      APP_NAME: ${APP_NAME:-Secure Public Application}
    networks:
      - app_net
    expose:
      - "5000"
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: protected_admin
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - internal_net
    expose:
      - "5001"
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  internal_net:
    driver: bridge
    internal: true

volumes:
  proxy_logs:
