<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="white"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Secure Public-Facing Application Platform</text>

  <rect x="40" y="90" width="190" height="90" rx="12" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="135" y="128" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Client / Browser</text>
  <text x="135" y="156" text-anchor="middle" font-family="Arial" font-size="14">HTTP :8080</text>

  <rect x="285" y="70" width="270" height="140" rx="12" fill="#e8f1ff" stroke="#333" stroke-width="2"/>
  <text x="420" y="108" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Docker: edge</text>
  <text x="420" y="142" text-anchor="middle" font-family="Arial" font-size="18">Nginx Reverse Proxy</text>
  <text x="420" y="172" text-anchor="middle" font-family="Arial" font-size="14">Only published host port</text>

  <line x1="230" y1="135" x2="285" y2="135" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="285" y="275" width="270" height="180" rx="12" fill="#eff9ee" stroke="#333" stroke-width="2"/>
  <text x="420" y="310" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Docker: app_net</text>
  <text x="420" y="350" text-anchor="middle" font-family="Arial" font-size="18">public_web</text>
  <text x="420" y="382" text-anchor="middle" font-family="Arial" font-size="14">Flask application :5000</text>
  <text x="420" y="420" text-anchor="middle" font-family="Arial" font-size="13">No host port published</text>

  <line x1="420" y1="210" x2="420" y2="275" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="700" y="275" width="350" height="180" rx="12" fill="#fff3e6" stroke="#333" stroke-width="2"/>
  <text x="875" y="310" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Docker: internal_net</text>
  <text x="875" y="350" text-anchor="middle" font-family="Arial" font-size="18">protected_admin</text>
  <text x="875" y="382" text-anchor="middle" font-family="Arial" font-size="14">Flask service :5001</text>
  <text x="875" y="420" text-anchor="middle" font-family="Arial" font-size="13">No host port published</text>

  <line x1="555" y1="175" x2="875" y2="275" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="690" y="205" font-family="Arial" font-size="14">/admin/ route</text>

  <rect x="700" y="520" width="350" height="120" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
  <text x="875" y="555" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Access Control</text>
  <text x="875" y="585" text-anchor="middle" font-family="Arial" font-size="14">Basic Authentication</text>
  <text x="875" y="610" text-anchor="middle" font-family="Arial" font-size="13">401 without credentials / 200 with valid credentials</text>

  <line x1="875" y1="455" x2="875" y2="520" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="80" y="520" width="480" height="120" rx="12" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="320" y="555" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Logging / Monitoring Evidence</text>
  <text x="320" y="585" text-anchor="middle" font-family="Arial" font-size="14">Nginx access/error logs</text>
  <text x="320" y="610" text-anchor="middle" font-family="Arial" font-size="14">web + admin container logs</text>

  <line x1="420" y1="455" x2="320" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875" y1="455" x2="450" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
